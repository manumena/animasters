<div id="avatar-picker-directions" class="viz-carousel viz-dotted-background" aria-label="Avatar picker design alternatives">
  <section data-variant="Arcade arrows" aria-label="Arcade arrows">
    <form class="picker-entry">
      <header class="entry-header"><span class="entry-brand">Animasters</span><h2>Join a room</h2></header>
      <label class="entry-field">Nickname<input name="nickname" placeholder="Your nickname" maxlength="24" required></label>
      <div class="picker-stage arrow-stage">
        <button type="button" class="arrow" data-cycle="-1" aria-label="Previous hairstyle">‹</button>
        <canvas data-avatar width="384" height="384" role="img" aria-label="Current avatar"></canvas>
        <button type="button" class="arrow" data-cycle="1" aria-label="Next hairstyle">›</button>
      </div>
      <div class="current-part" data-current aria-live="polite"></div>
      <label class="entry-field">Change<select data-slot></select></label>
      <div class="entry-action"><button class="join" type="button">Join room</button><span data-result role="status"></span></div>
    </form>
  </section>

  <section data-variant="Thumbnail picker" aria-label="Thumbnail picker" hidden>
    <form class="picker-entry">
      <header class="entry-header"><span class="entry-brand">Animasters</span><h2>Join a room</h2></header>
      <label class="entry-field">Nickname<input name="nickname" placeholder="Your nickname" maxlength="24" required></label>
      <div class="picker-stage gallery-stage"><canvas data-avatar width="384" height="384" role="img" aria-label="Current avatar"></canvas></div>
      <div class="picker-categories" role="group" aria-label="Part category">
        <button type="button" data-category="hair">Hair</button><button type="button" data-category="face">Face</button><button type="button" data-category="props">Props</button>
      </div>
      <div class="picker-slots" data-slots role="group" aria-label="Part to change"></div>
      <div class="picker-thumbnails" data-options role="group" aria-label="Hairstyle choices"></div>
      <div class="entry-action"><button class="join" type="button">Join room</button><span data-result role="status"></span></div>
    </form>
  </section>

  <section data-variant="Starter looks" aria-label="Starter looks" hidden>
    <form class="picker-entry">
      <header class="entry-header"><span class="entry-brand">Animasters</span><h2>Join a room</h2></header>
      <label class="entry-field">Nickname<input name="nickname" placeholder="Your nickname" maxlength="24" required></label>
      <div class="picker-stage starter-stage"><canvas data-avatar width="384" height="384" role="img" aria-label="Current avatar"></canvas></div>
      <div class="starter-controls">
        <div class="starter-looks" data-starters role="group" aria-label="Starter looks"></div>
        <div class="fine-tune" data-fine-tune hidden>
          <label class="entry-field">Change<select data-slot></select></label>
          <label class="entry-field"><span data-value-label>Hairstyle</span><select data-value></select></label>
        </div>
        <button class="tune-toggle" type="button" data-tune>Fine-tune look</button>
      </div>
      <div class="entry-action"><button class="join" type="button">Join room</button><span data-result role="status"></span></div>
    </form>
  </section>
</div>

  #avatar-picker-directions .starter-stage { min-block-size: 172px; --portrait-size: 172px; }
  #avatar-picker-directions .current-part { text-align: center; color: var(--entry-muted); }
  #avatar-picker-directions .picker-categories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
  #avatar-picker-directions .picker-slots { display: flex; flex-wrap: wrap; gap: 4px; }
  #avatar-picker-directions .picker-slots button { min-height: 34px; font-size: 12px; padding: 3px 6px; }
  #avatar-picker-directions .picker-thumbnails, #avatar-picker-directions .starter-looks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  #avatar-picker-directions .starter-looks { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  #avatar-picker-directions .starter-looks .option canvas { width: 68px; }

  #avatar-picker-directions .starter-controls { display: grid; gap: 8px; }
  #avatar-picker-directions .fine-tune { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; min-height: 86px; align-content: center; }
  #avatar-picker-directions .entry-action { margin-top: auto; display: grid; gap: 4px; }
  #avatar-picker-directions .entry-action .join { width: 100%; min-height: 42px; color: var(--entry-on-accent); background: var(--entry-accent); border-color: var(--entry-accent); font-weight: 650; }
  #avatar-picker-directions [data-result] { min-height: 16px; color: var(--entry-muted); font-size: 12px; }
  @media (max-width: 420px) {
    #avatar-picker-directions > section { padding-inline: 6px; min-block-size: 686px; }
    #avatar-picker-directions .picker-entry { padding: 12px; min-block-size: 620px; }
    #avatar-picker-directions input, #avatar-picker-directions select { font-size: 16px; }

    #avatar-picker-directions .picker-entry button, #avatar-picker-directions .picker-entry input, #avatar-picker-directions .picker-entry select { min-height: 44px; }
  }

  function newCanvas(width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    return canvas;
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('A comparison image could not be loaded.'));
      image.src = url;
    });
  }

  function cleanSprite(image, rectangle, keepLargest, minimumAlpha = 36) {
    const [sourceX, sourceY, width, height] = rectangle;
    const canvas = newCanvas(Math.ceil(width), Math.ceil(height));
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(image, sourceX, sourceY, width, height, 0, 0, canvas.width, canvas.height);
    const data = context.getImageData(0, 0, canvas.width, canvas.height);
    const labels = new Int32Array(canvas.width * canvas.height);
    const queue = new Int32Array(labels.length);
    const componentSizes = [0];
    let largest = 0;

    for (let start = 0; start < labels.length; start += 1) {
      if (labels[start] || data.data[start * 4 + 3] < minimumAlpha) continue;
      const label = componentSizes.length;
      let read = 0;
      let write = 1;
      queue[0] = start;
      labels[start] = label;

      while (read < write) {
        const index = queue[read++];
        const x = index % canvas.width;
        const neighbors = [];
        if (x > 0) neighbors.push(index - 1);
        if (x + 1 < canvas.width) neighbors.push(index + 1);
        if (index >= canvas.width) neighbors.push(index - canvas.width);
        if (index + canvas.width < labels.length) neighbors.push(index + canvas.width);

        for (const neighbor of neighbors) {
          if (labels[neighbor] || data.data[neighbor * 4 + 3] < minimumAlpha) continue;
          labels[neighbor] = label;
          queue[write++] = neighbor;
        }
      }

      componentSizes.push(write);
      if (write > componentSizes[largest]) largest = label;
    }

    let left = canvas.width;
    let top = canvas.height;
    let right = 0;
    let bottom = 0;
    for (let index = 0; index < labels.length; index += 1) {
      const label = labels[index];
      const keep = keepLargest ? label === largest && label !== 0 : componentSizes[label] >= 12;
      if (!keep) {
        data.data[index * 4 + 3] = 0;
        continue;
      }
      const x = index % canvas.width;
      const y = Math.floor(index / canvas.width);
      left = Math.min(left, x);
      right = Math.max(right, x);
      top = Math.min(top, y);
      bottom = Math.max(bottom, y);
    }

    context.putImageData(data, 0, 0);
    // Facial cells retain their full grid coordinates. Trimming each eye or
    // mouth would move its anchor when an expression changes shape.
    if (!keepLargest) return canvas;
    if (left > right) throw new Error('An avatar sprite has no visible pixels.');
    const trimmed = newCanvas(right - left + 1, bottom - top + 1);
    trimmed.getContext('2d').drawImage(canvas, left, top, trimmed.width, trimmed.height, 0, 0, trimmed.width, trimmed.height);
    return trimmed;
  }

  function traceCurve(path, profile, points) {
    path.lineTo(...coordinates(profile, ...points[0]));
    for (let index = 1; index < points.length; index += 1) {
      const [previousAlong, previousAcross] = points[index - 1];
      const [along, across] = points[index];
      const midpoint = (previousAlong + along) / 2;
      path.bezierCurveTo(
        ...coordinates(profile, midpoint, previousAcross),
        ...coordinates(profile, midpoint, across),
        ...coordinates(profile, along, across)
      );
    }
  }

  function makePropLayers(profile, sprite) {
    const front = new Path2D();

      const right = [...profile.curves[1].points].reverse();
      front.moveTo(...coordinates(profile, ...left[0]));
      traceCurve(front, profile, left);
      traceCurve(front, profile, right);
      front.closePath();
    } else {
      for (const { points } of profile.curves) {
        front.moveTo(...coordinates(profile, points[0][0], profile.foreground));
        traceCurve(front, profile, points);
        front.lineTo(...coordinates(profile, points.at(-1)[0], profile.foreground));
        front.closePath();

    }

    rear.rect(0, 0, 1, 1);
    rear.addPath(front);
    return { sprite, front, rear, rectangle: profile.rectangle };

    if (kind === 'skin' ? id === 'warm' : id === 'charcoal') return source;
    const key = [kind, id, spriteId].join('-');
    if (tintedSprites.has(key)) return tintedSprites.get(key);

    const canvas = newCanvas(source.width, source.height);
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(source, 0, 0);
    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imageData.data;
    const color = palettes[kind][id].rgb;
    const middle = kind === 'skin' ? 188 : 58;

    for (let index = 0; index < pixels.length; index += 4) {
      if (!pixels[index + 3]) continue;
      const red = pixels[index];
      const green = pixels[index + 1];
      const blue = pixels[index + 2];

      if (kind === 'skin' && (red < green * 1.07 || red < blue * 1.17)) continue;

    const showResult = () => {
      const nickname = input.value.trim();
      view.section.querySelector('[data-result]').textContent = nickname ? 'Preview ready for ' + nickname : 'Enter a nickname';
    };
    // The embedded preview sandbox blocks form submission. Keep the entry
    // action local and give the nickname field an equivalent keyboard action.
    view.section.querySelector('.join').addEventListener('click', showResult);
    input.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing) return;
      event.preventDefault();
      showResult();
    });
  }

  function connectDesignControls(view) {
    if (!globalThis.Tweak) return;
    const stage = view.section.querySelector('.picker-stage');
    const size = Number.parseInt(getComputedStyle(stage).getPropertyValue('--portrait-size'), 10);
    const design = { size };
    const tweak = new globalThis.Tweak({ container: view.section.querySelector('form'), onChange: () => {
      stage.style.setProperty('--portrait-size', design.size + 'px');
    } });
    tweak.addSlider(design, 'size', { label: 'Portrait size', min: size - 20, max: size + 12, unit: 'px' });
  }

  async function initialize() {
    restoreLooks(window.openai?.widgetState?.privateContent);
    const connections = { 'Arcade arrows': connectArrows, 'Thumbnail picker': connectGallery, 'Starter looks': connectStarters };
    for (const view of views) {
      connections[view.name](view);
      connectEntry(view);
      render(view);
      connectDesignControls(view);
    }
    window.addEventListener('openai:set_globals', event => {
      restoreLooks(event.detail?.globals?.widgetState?.privateContent);
      for (const view of views) render(view);
    });

    try {
      await loadAvatarArtwork();
      artworkReady = true;
      for (const view of views) {
        for (const card of view.starterCards) drawAvatar(card.canvas, card.look);
        render(view);
      }
      root.dataset.ready = 'true';
    } catch (error) {
      for (const view of views) view.section.querySelector('[data-result]').textContent = error.message;
    }
  }

  initialize();

})();
</script>
