  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {

    }

      postToHost(&quot;follow-up&quot;, { context, prompt, title });

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next

   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

      nextState,

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      privateContent: null,
      ...parsedState,

    }

    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

      }
      hostPort = nextHostPort;

    }

      return;
    }

        id = decodeURIComponent(href.slice(1));

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;animasters-lobby-studies&#x27;);
    const clone = name =&gt; document.getElementById(`lobby-${name}-template`).content.cloneNode(true);

    function createLobby(scene) {
      const dedicated = [&#x27;focused&#x27;, &#x27;overview&#x27;].includes(scene.dataset.layout);
      const state = {
        host: true,
        ready: [false, true, true, false],
        settings: { amount: 40, openings: true, endings: true, soundtracks: false },
      };
      scene.append(clone(&#x27;chrome&#x27;));
      const body = scene.querySelector(&#x27;.lobby-body&#x27;);
      body.append(clone(&#x27;players&#x27;), clone(dedicated ? &#x27;summary&#x27; : &#x27;settings&#x27;), clone(&#x27;ready&#x27;));

      // Dedicated settings is a local screen, not a second connection or room.
      const editor = document.createElement(&#x27;section&#x27;);
      editor.className = &#x27;lobby-settings-screen&#x27;;
      editor.hidden = true;
      if (dedicated) {
        const back = document.createElement(&#x27;button&#x27;);
        back.type = &#x27;button&#x27;;
        back.className = &#x27;lobby-button cursor-interaction&#x27;;
        back.textContent = &#x27;← Back to lobby&#x27;;
        back.addEventListener(&#x27;click&#x27;, cancelSettings);
        editor.append(back, clone(&#x27;settings&#x27;));
        body.append(editor);
      }

      const form = scene.querySelector(&#x27;.lobby-settings-form&#x27;);
      const save = form.querySelector(&#x27;.lobby-save&#x27;);
      const readyButton = scene.querySelector(&#x27;[data-action=&quot;ready&quot;]&#x27;);
      const feedback = scene.querySelector(&#x27;.lobby-feedback&#x27;);
      const cancel = form.querySelector(&#x27;[data-action=&quot;cancel&quot;]&#x27;);
      cancel.hidden = !dedicated;

      function draftSettings() {
        return {
          amount: Number(form.elements.amount.value),
          openings: form.elements.openings.checked,
          endings: form.elements.endings.checked,
          soundtracks: form.elements.soundtracks.checked,
        };
      }

      function dirty() {
        return JSON.stringify(draftSettings()) !== JSON.stringify(state.settings);
      }

      function restoreDraft() {
        form.elements.amount.value = state.settings.amount;
        for (const name of [&#x27;openings&#x27;, &#x27;endings&#x27;, &#x27;soundtracks&#x27;]) {
          form.elements[name].checked = state.settings[name];
        }
      }

      function showSettings(show) {
        for (const child of body.children) child.hidden = show ? child !== editor : child === editor;
        scene.querySelector(&#x27;h1&#x27;).textContent = show ? &#x27;Match preferences&#x27; : &#x27;Your room&#x27;;
        const focusTarget = show ? editor.querySelector(&#x27;button&#x27;) : scene.querySelector(&#x27;[data-action=&quot;settings&quot;]&#x27;);
        focusTarget?.focus();
      }

      function cancelSettings() {
        restoreDraft();
        showSettings(false);
        render();
      }

      function render() {
        const changed = dirty();
        form.querySelector(&#x27;fieldset&#x27;).disabled = !state.host || state.ready[0];
        save.disabled = !state.host || state.ready[0] || !changed || !form.checkValidity();
        readyButton.disabled = state.host &amp;&amp; changed;
        readyButton.textContent = state.ready[0] ? &#x27;Not ready&#x27; : &#x27;Enable audio &amp; Ready&#x27;;
        scene.querySelector(&#x27;.lobby-host-label&#x27;).textContent = state.host ? &#x27;Host controls&#x27; : &#x27;Read only&#x27;;
        scene.querySelector(&#x27;.lobby-name small&#x27;).textContent = state.host ? &#x27;You · Host&#x27; : &#x27;You&#x27;;
        form.querySelector(&#x27;.lobby-edit-note&#x27;).textContent = !state.host
          ? &#x27;Only the host can change these settings.&#x27;
          : state.ready[0]
            ? &#x27;Click Not ready in the lobby to edit preferences.&#x27;
            : changed
              ? &#x27;Unsaved changes. Save before becoming ready.&#x27;
              : &#x27;Saving changes clears everyone’s Ready status.&#x27;;

        const readyCount = state.ready.filter(Boolean).length;
        scene.querySelector(&#x27;.lobby-ready-count&#x27;).textContent = `${readyCount} ready`;
        for (const label of scene.querySelectorAll(&#x27;[data-player]&#x27;)) {
          const isReady = state.ready[Number(label.dataset.player)];
          label.textContent = isReady ? &#x27;Ready&#x27; : &#x27;Not ready&#x27;;
          label.toggleAttribute(&#x27;data-ready&#x27;, isReady);
        }

        if (dedicated) {
          scene.querySelector(&#x27;.lobby-song-count&#x27;).textContent = `${state.settings.amount} songs`;
          const types = [&#x27;openings&#x27;, &#x27;endings&#x27;, &#x27;soundtracks&#x27;].filter(name =&gt; state.settings[name]);
          scene.querySelector(&#x27;.lobby-selected-types&#x27;).textContent = types.length
            ? types.map(name =&gt; name[0].toUpperCase() + name.slice(1)).join(&#x27; · &#x27;)
            : &#x27;All song types&#x27;;
        }
      }

      form.addEventListener(&#x27;input&#x27;, render);
      form.addEventListener(&#x27;submit&#x27;, event =&gt; event.preventDefault());
      save.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (save.disabled || !form.reportValidity()) return;
        state.settings = draftSettings();
        state.ready.fill(false);
        feedback.textContent = &#x27;Preferences saved. Everyone needs to ready up again.&#x27;;
        if (dedicated) showSettings(false);
        render();
      });
      cancel.addEventListener(&#x27;click&#x27;, cancelSettings);
      scene.querySelector(&#x27;[data-action=&quot;settings&quot;]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; showSettings(true));
      readyButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        state.ready[0] = !state.ready[0];
        feedback.textContent = state.ready[0] ? &#x27;Ready — waiting for the other players. Preview only; no audio is played.&#x27; : &#x27;You are not ready.&#x27;;
        render();
      });
      scene.querySelector(&#x27;[data-action=&quot;invite&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const detail = scene.querySelector(&#x27;.lobby-invite-detail&#x27;);
        detail.hidden = !detail.hidden;
        if (!detail.hidden) detail.querySelector(&#x27;input&#x27;).select();
      });

      // Preview role switching explores the guest&#x27;s read-only presentation.
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: scene, onChange: () =&gt; { restoreDraft(); render(); } });
        tweak.addToggle(state, &#x27;host&#x27;, { label: &#x27;View as host&#x27; });
      }
      render();
    }

    for (const scene of root.querySelectorAll(&#x27;.lobby-scene&#x27;)) createLobby(scene);
    if (globalThis.lucide) lucide.createIcons();
  })();
&lt;/script&gt;
