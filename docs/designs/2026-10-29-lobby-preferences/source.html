<div id="animasters-lobby-studies" class="viz-carousel" aria-label="Lobby and match preferences">
  <section data-variant="Side by side" aria-label="Side by side"><div class="lobby-scene" data-layout="split"></div></section>
  <section data-variant="One room card" aria-label="One room card" hidden><div class="lobby-scene" data-layout="stack"></div></section>
  <section data-variant="Focused lobby" aria-label="Focused lobby" hidden><div class="lobby-scene" data-layout="focused"></div></section>
  <section data-variant="Lobby overview" aria-label="Lobby overview" hidden><div class="lobby-scene" data-layout="overview"></div></section>
</div>

<template id="lobby-chrome-template">
  <header class="lobby-header"><span class="lobby-brand"><span class="lobby-mark"><i data-lucide="headphones" aria-hidden="true"></i></span><strong>ani</strong>masters<small>BETA</small></span></header>
  <main class="lobby-main">
    <div class="lobby-heading"><div><p class="lobby-eyebrow">Your anime game night</p><h1>Your room</h1></div><span class="lobby-connected">● Connected</span></div>
    <section class="lobby-invite" aria-label="Invite friends">
      <div><span class="lobby-muted">Room code</span><strong class="lobby-code">A7B2</strong></div>
      <div class="lobby-invite-actions"><button type="button" class="lobby-button cursor-interaction" data-action="invite"><i data-lucide="link" aria-hidden="true"></i> Invite friends</button><span class="lobby-small">Share the code or invite link.</span></div>
      <div class="lobby-invite-detail" hidden><label>Example invite link<input readonly value="https://animasters.pages.dev/rooms/A7B2"></label><p class="lobby-small">Design preview only — this is an example room.</p></div>
    </section>
    <div class="lobby-body"></div>
    <div class="lobby-feedback" role="status"></div>
  </main>
</template>

<template id="lobby-players-template">
  <section class="lobby-players lobby-panel">
    <div class="lobby-section-heading"><h2>Players <span class="lobby-muted">4 / 10</span></h2><span class="lobby-ready-count">2 ready</span></div>
    <ul class="lobby-player-list">
      <li><span class="lobby-initial" aria-hidden="true">M</span><span class="lobby-name">Manu <small>You · Host</small></span><span class="lobby-player-status" data-player="0">Not ready</span></li>
      <li><span class="lobby-initial" aria-hidden="true">A</span><span class="lobby-name">Alex</span><span class="lobby-player-status" data-player="1">Ready</span></li>
      <li><span class="lobby-initial" aria-hidden="true">Y</span><span class="lobby-name">Yui</span><span class="lobby-player-status" data-player="2">Ready</span></li>
      <li><span class="lobby-initial" aria-hidden="true">D</span><span class="lobby-name">Dani</span><span class="lobby-player-status" data-player="3">Not ready</span></li>
    </ul>
    <p class="lobby-small lobby-room-note">Room for 6 more. Invite your friends before you ready up.</p>
  </section>
</template>

<template id="lobby-settings-template">
  <section class="lobby-preferences lobby-panel">
    <div class="lobby-section-heading"><h2>Match preferences</h2><span class="lobby-small lobby-host-label">Host controls</span></div>
    <form class="lobby-settings-form">
      <fieldset>
        <label class="lobby-amount">Songs per match<input type="number" name="amount" value="40" min="1" max="999" step="1" required></label>
        <div class="lobby-song-types"><p class="lobby-field-label">Song types</p><label><input name="openings" type="checkbox" checked> Openings</label><label><input name="endings" type="checkbox" checked> Endings</label><label><input name="soundtracks" type="checkbox"> Soundtracks</label></div>
      </fieldset>
      <p class="lobby-small lobby-types-note">No types selected means all types.</p>
      <p class="lobby-repeat"><i data-lucide="list-music" aria-hidden="true"></i>No repeated anime</p>
      <p class="lobby-small lobby-edit-note">Saving changes clears everyone’s Ready status.</p>
      <div class="lobby-settings-actions"><button class="lobby-button cursor-interaction" type="button" data-action="cancel" hidden>Cancel</button><button class="lobby-button lobby-save cursor-interaction" type="button" disabled>Save settings</button></div>
    </form>
  </section>
</template>

<template id="lobby-summary-template">
  <section class="lobby-summary lobby-panel"><div class="lobby-section-heading"><h2>The next match</h2><i data-lucide="music-2" aria-hidden="true"></i></div><strong class="lobby-song-count">40 songs</strong><p class="lobby-selected-types">Openings · Endings</p><p class="lobby-small">No repeated anime</p><button class="lobby-button cursor-interaction" type="button" data-action="settings"><i data-lucide="settings-2" aria-hidden="true"></i> Match preferences</button></section>
</template>

<template id="lobby-ready-template">
  <div class="lobby-ready-area"><div><strong>Ready when you are.</strong><p class="lobby-small">The match starts when everyone connected is ready.</p></div><button class="lobby-button lobby-primary cursor-interaction" type="button" data-action="ready"><i data-lucide="headphones" aria-hidden="true"></i> Enable audio &amp; Ready</button></div>
</template>

<style>

  #animasters-lobby-studies [data-layout='stack'] .lobby-ready-area { border: 0; border-top: 1px solid var(--lobby-line); border-radius: 0 0 18px 18px; }

<script>
  (() => {
    const root = document.getElementById('animasters-lobby-studies');
    const clone = name => document.getElementById(`lobby-${name}-template`).content.cloneNode(true);

    function createLobby(scene) {
      const dedicated = ['focused', 'overview'].includes(scene.dataset.layout);
      const state = {
        host: true,
        ready: [false, true, true, false],
        settings: { amount: 40, openings: true, endings: true, soundtracks: false },
      };
      scene.append(clone('chrome'));
      const body = scene.querySelector('.lobby-body');
      body.append(clone('players'), clone(dedicated ? 'summary' : 'settings'), clone('ready'));

      // Dedicated settings is a local screen, not a second connection or room.
      const editor = document.createElement('section');
      editor.className = 'lobby-settings-screen';
      editor.hidden = true;
      if (dedicated) {
        const back = document.createElement('button');
        back.type = 'button';
        back.className = 'lobby-button cursor-interaction';
        back.textContent = '← Back to lobby';
        back.addEventListener('click', cancelSettings);
        editor.append(back, clone('settings'));
        body.append(editor);
      }

      const form = scene.querySelector('.lobby-settings-form');
      const save = form.querySelector('.lobby-save');
      const readyButton = scene.querySelector('[data-action="ready"]');
      const feedback = scene.querySelector('.lobby-feedback');
      const cancel = form.querySelector('[data-action="cancel"]');
      cancel.hidden = !dedicated;

      function draftSettings() {
        return {
          amount: Number(form.elements.amount.value),
          openings: form.elements.openings.checked,
          endings: form.elements.endings.checked,
          soundtracks: form.elements.soundtracks.checked,
        };
      }

      function dirty() {
        return JSON.stringify(draftSettings()) !== JSON.stringify(state.settings);
      }

      function restoreDraft() {
        form.elements.amount.value = state.settings.amount;
        for (const name of ['openings', 'endings', 'soundtracks']) {
          form.elements[name].checked = state.settings[name];
        }
      }

      function showSettings(show) {
        for (const child of body.children) child.hidden = show ? child !== editor : child === editor;
        scene.querySelector('h1').textContent = show ? 'Match preferences' : 'Your room';
        const focusTarget = show ? editor.querySelector('button') : scene.querySelector('[data-action="settings"]');
        focusTarget?.focus();
      }

      function cancelSettings() {
        restoreDraft();
        showSettings(false);
        render();
      }

      function render() {
        const changed = dirty();
        form.querySelector('fieldset').disabled = !state.host || state.ready[0];
        save.disabled = !state.host || state.ready[0] || !changed || !form.checkValidity();
        readyButton.disabled = state.host && changed;
        readyButton.textContent = state.ready[0] ? 'Not ready' : 'Enable audio & Ready';
        scene.querySelector('.lobby-host-label').textContent = state.host ? 'Host controls' : 'Read only';
        scene.querySelector('.lobby-name small').textContent = state.host ? 'You · Host' : 'You';
        form.querySelector('.lobby-edit-note').textContent = !state.host
          ? 'Only the host can change these settings.'
          : state.ready[0]
            ? 'Click Not ready in the lobby to edit preferences.'
            : changed
              ? 'Unsaved changes. Save before becoming ready.'
              : 'Saving changes clears everyone’s Ready status.';

        const readyCount = state.ready.filter(Boolean).length;
        scene.querySelector('.lobby-ready-count').textContent = `${readyCount} ready`;
        for (const label of scene.querySelectorAll('[data-player]')) {
          const isReady = state.ready[Number(label.dataset.player)];
          label.textContent = isReady ? 'Ready' : 'Not ready';
          label.toggleAttribute('data-ready', isReady);
        }

        if (dedicated) {
          scene.querySelector('.lobby-song-count').textContent = `${state.settings.amount} songs`;
          const types = ['openings', 'endings', 'soundtracks'].filter(name => state.settings[name]);
          scene.querySelector('.lobby-selected-types').textContent = types.length
            ? types.map(name => name[0].toUpperCase() + name.slice(1)).join(' · ')
            : 'All song types';
        }
      }

      form.addEventListener('input', render);
      form.addEventListener('submit', event => event.preventDefault());
      save.addEventListener('click', () => {
        if (save.disabled || !form.reportValidity()) return;
        state.settings = draftSettings();
        state.ready.fill(false);
        feedback.textContent = 'Preferences saved. Everyone needs to ready up again.';
        if (dedicated) showSettings(false);
        render();
      });
      cancel.addEventListener('click', cancelSettings);
      scene.querySelector('[data-action="settings"]')?.addEventListener('click', () => showSettings(true));
      readyButton.addEventListener('click', () => {
        state.ready[0] = !state.ready[0];
        feedback.textContent = state.ready[0] ? 'Ready — waiting for the other players. Preview only; no audio is played.' : 'You are not ready.';
        render();
      });
      scene.querySelector('[data-action="invite"]').addEventListener('click', () => {
        const detail = scene.querySelector('.lobby-invite-detail');
        detail.hidden = !detail.hidden;
        if (!detail.hidden) detail.querySelector('input').select();
      });

      // Preview role switching explores the guest's read-only presentation.
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: scene, onChange: () => { restoreDraft(); render(); } });
        tweak.addToggle(state, 'host', { label: 'View as host' });
      }
      render();
    }

    for (const scene of root.querySelectorAll('.lobby-scene')) createLobby(scene);
    if (globalThis.lucide) lucide.createIcons();
  })();
</script>
