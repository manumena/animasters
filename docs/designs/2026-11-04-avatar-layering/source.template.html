<div id="avatar-layering-lab">
  <style>
    #avatar-layering-lab { display: grid; gap: 1rem; }
    #avatar-layering-lab .lab-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(220px, 1fr); gap: 1.25rem; align-items: start; }
    #avatar-layering-lab .preview-column, #avatar-layering-lab .choices { display: grid; gap: 1rem; min-width: 0; }
    #avatar-layering-lab .avatar-stage { display: grid; place-items: center; }
    #avatar-layering-lab .avatar-stage > canvas { display: block; width: 100%; max-width: 360px; height: auto; }
    #avatar-layering-lab .field { display: grid; gap: .35rem; min-width: 0; }
    #avatar-layering-lab .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    #avatar-layering-lab .small-previews { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
    #avatar-layering-lab .small-preview { display: flex; align-items: center; gap: .5rem; }
    #avatar-layering-lab .layer-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
    #avatar-layering-lab .layer-list[hidden] { display: none; }
    #avatar-layering-lab .layer-list figure { margin: 0; text-align: center; min-width: 0; }
    #avatar-layering-lab .layer-list canvas { width: 100%; height: auto; }
    #avatar-layering-lab .fit-controls { display: grid; gap: .75rem; margin-top: .75rem; }
    #avatar-layering-lab details > summary { width: fit-content; }
    #avatar-layering-lab .range-heading { display: flex; justify-content: space-between; gap: .5rem; }
    #avatar-layering-lab output { font-variant-numeric: tabular-nums; }
    #avatar-layering-lab .status-line { min-height: 1.5em; }
    @media (max-width: 560px) {
      #avatar-layering-lab .lab-layout { grid-template-columns: 1fr; }
      #avatar-layering-lab .avatar-stage > canvas { max-width: 300px; }
    }
  </style>

  <h2>Avatar fitting lab</h2>
  <div class="lab-layout">
    <div class="preview-column">
      <div class="card avatar-stage">
        <canvas id="avatar-main" width="768" height="768" role="img" aria-label="Live avatar assembled from separate transparent layers"></canvas>
      </div>
      <div class="small-previews">
        <div class="small-preview"><canvas id="avatar-small" width="80" height="80" style="width:40px;height:40px" role="img" aria-label="Avatar at 40 pixels"></canvas><span class="text-small">40 px</span></div>
        <div class="small-preview"><canvas id="avatar-medium" width="128" height="128" style="width:64px;height:64px" role="img" aria-label="Avatar at 64 pixels"></canvas><span class="text-small">64 px</span></div>
      </div>
      <label class="form-check"><input id="avatar-inspect" class="form-check-input" type="checkbox"><span class="form-check-label">Show separate layers</span></label>
      <div id="avatar-layers" class="layer-list" hidden>
        <figure><canvas width="144" height="144" data-layer-preview="base" role="img" aria-label="Base layer"></canvas><figcaption class="text-small">Base</figcaption></figure>
        <figure><canvas width="144" height="144" data-layer-preview="hair" role="img" aria-label="Hair layer"></canvas><figcaption class="text-small">Hair</figcaption></figure>
        <figure><canvas width="144" height="144" data-layer-preview="headgear" role="img" aria-label="Headwear layer"></canvas><figcaption class="text-small">Headwear</figcaption></figure>
        <figure><canvas width="144" height="144" data-layer-preview="face" role="img" aria-label="Face accessory layer"></canvas><figcaption class="text-small">Face</figcaption></figure>
      </div>
    </div>

    <div class="choices">
      <label class="field form-label">Headwear
        <select id="avatar-headwear" class="form-select">
          <option value="straw">Luffy · Straw hat</option>
          <option value="leaf">Naruto · Leaf headband</option>
          <option value="chopper">Chopper · Pink hat</option>
          <option value="none">None</option>
        </select>
      </label>
      <label class="field form-label">Face accessory
        <select id="avatar-face" class="form-select"><option value="none">None</option><option value="blindfold">Gojo · Blindfold</option></select>
      </label>
      <div class="field-pair">
        <label class="field form-label">Hair volume
          <select id="avatar-hair" class="form-select"><option value="compact">Compact</option><option value="tall">Tall</option><option value="none">Bald</option></select>
        </label>
        <label class="field form-label">Hair color
          <select id="avatar-color" class="form-select"><option value="charcoal">Charcoal</option><option value="brown">Brown</option><option value="blue">Blue</option><option value="pink">Pink</option><option value="blond">Blond</option></select>
        </label>
      </div>
      <label class="field form-label">Skin tone
        <select id="avatar-skin" class="form-select"><option value="original">Warm</option><option value="light">Light</option><option value="medium">Medium</option><option value="deep">Deep</option></select>
      </label>
      <label class="form-check"><input id="avatar-tuck" class="form-check-input" type="checkbox" checked><span class="form-check-label">Tuck hair under hats</span></label>
      <button type="button" class="btn" id="avatar-shuffle">Shuffle combination</button>

      <details id="avatar-adjustments">
        <summary class="cursor-interaction">Adjust overlap</summary>
        <div class="fit-controls">
          <label class="field form-label">Layer
            <select id="avatar-edit-layer" class="form-select"><option value="headgear">Headwear</option><option value="hair">Hair</option><option value="face">Face accessory</option></select>
          </label>
          <label class="field form-label"><span class="range-heading">Horizontal <output id="avatar-x-value">0 px</output></span><input id="avatar-x" class="form-range" type="range" min="-80" max="80" value="0" step="1"></label>
          <label class="field form-label"><span class="range-heading">Vertical <output id="avatar-y-value">0 px</output></span><input id="avatar-y" class="form-range" type="range" min="-80" max="80" value="0" step="1"></label>
          <label class="field form-label"><span class="range-heading">Size <output id="avatar-scale-value">100%</output></span><input id="avatar-scale" class="form-range" type="range" min="65" max="140" value="100" step="1"></label>
          <label class="field form-label">Headwear order
            <select id="avatar-order" class="form-select"><option value="over">Over hair</option><option value="under">Under hair</option></select>
          </label>
          <label class="form-check"><input id="avatar-bounds" class="form-check-input" type="checkbox"><span class="form-check-label">Show selected layer bounds</span></label>
          <button type="button" id="avatar-restore" class="btn">Restore this layer’s fit</button>
        </div>
      </details>
    </div>
  </div>
  <div id="avatar-status" class="text-small status-line" role="status" aria-live="polite">Loading avatar layers…</div>
</div>
<script>
(() => {
  const root = document.getElementById('avatar-layering-lab');
  const find = id => root.querySelector('#' + id);
  const sourceUrls = __AVATAR_ASSETS__;
  const sprites = {};
  const toneCache = new Map();
  const canvasSize = 512;
  const originalFits = {
    base: { x: 136, y: 110, width: 240, height: 336 },
    compact: { x: 126, y: 67, width: 260, height: 195 },
    tall: { x: 118, y: 39, width: 276, height: 224 },
    straw: { x: 103, y: 24, width: 306, height: 202 },
    leaf: { x: 130, y: 133, width: 252, height: 145 },
    chopper: { x: 98, y: 13, width: 316, height: 216 },
    blindfold: { x: 132, y: 205, width: 248, height: 98 }
  };
  const hairColors = { charcoal: [62, 61, 66], brown: [105, 65, 43], blue: [48, 88, 158], pink: [183, 82, 129], blond: [201, 157, 69] };
  const skinTones = { original: [1, 1, 1], light: [1.09, 1.13, 1.2], medium: [.77, .7, .66], deep: [.49, .4, .37] };
  const itemLabels = { straw: 'Luffy’s straw hat', leaf: 'Leaf headband', chopper: 'Chopper’s hat', none: 'No headwear' };
  const initialState = {
    headwear: 'straw', face: 'none', hair: 'compact', color: 'charcoal', skin: 'original',
    tuck: true, inspect: false, bounds: false, order: 'over', editLayer: 'headgear', fits: {}
  };
  let state = structuredClone(initialState);
  let ready = false;

  function newCanvas(width, height) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    return canvas;
  }

  function loadImage(url) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('An avatar image could not be loaded.'));
      image.src = url;
    });
  }

  // Atlas cells contain transparent padding and a little generation noise. Keep
  // the largest connected silhouette so neither affects the sprite's anchors.
  function extractSprite(image, rectangle) {
    const [sourceX, sourceY, width, height] = rectangle;
    const working = newCanvas(Math.ceil(width), Math.ceil(height));
    const context = working.getContext('2d', { willReadFrequently: true });
    context.drawImage(image, sourceX, sourceY, width, height, 0, 0, working.width, working.height);
    const imageData = context.getImageData(0, 0, working.width, working.height);
    const pixels = imageData.data;
    const labels = new Int32Array(working.width * working.height);
    const queue = new Int32Array(labels.length);
    let componentId = 0;
    let largestId = 0;
    let largestCount = 0;

    for (let start = 0; start < labels.length; start += 1) {
      if (labels[start] || pixels[start * 4 + 3] < 28) continue;
      componentId += 1;
      let read = 0;
      let write = 1;
      queue[0] = start;
      labels[start] = componentId;

      while (read < write) {
        const index = queue[read++];
        const x = index % working.width;
        const neighbors = [];
        if (x > 0) neighbors.push(index - 1);
        if (x + 1 < working.width) neighbors.push(index + 1);
        if (index >= working.width) neighbors.push(index - working.width);
        if (index + working.width < labels.length) neighbors.push(index + working.width);

        for (const neighbor of neighbors) {
          if (labels[neighbor] || pixels[neighbor * 4 + 3] < 28) continue;
          labels[neighbor] = componentId;
          queue[write++] = neighbor;
        }
      }

      if (write > largestCount) {
        largestCount = write;
        largestId = componentId;
      }
    }

    if (!largestCount) throw new Error('An avatar layer has no visible pixels.');
    let left = working.width;
    let right = 0;
    let top = working.height;
    let bottom = 0;

    for (let index = 0; index < labels.length; index += 1) {
      if (labels[index] !== largestId) {
        pixels[index * 4 + 3] = 0;
        continue;
      }
      const x = index % working.width;
      const y = Math.floor(index / working.width);
      left = Math.min(left, x);
      right = Math.max(right, x);
      top = Math.min(top, y);
      bottom = Math.max(bottom, y);
    }

    context.putImageData(imageData, 0, 0);
    const trimmed = newCanvas(right - left + 1, bottom - top + 1);
    trimmed.getContext('2d').drawImage(working, left, top, trimmed.width, trimmed.height, 0, 0, trimmed.width, trimmed.height);
    return trimmed;
  }

  function tintedSprite(type) {
    const key = type === 'hair' ? 'hair-' + state.color : 'base-' + state.skin;
    if (toneCache.has(key)) return toneCache.get(key);
    const source = sprites[type];
    const canvas = newCanvas(source.width, source.height);
    const context = canvas.getContext('2d', { willReadFrequently: true });
    context.drawImage(source, 0, 0);
    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imageData.data;

    for (let index = 0; index < pixels.length; index += 4) {
      if (!pixels[index + 3]) continue;
      if (type === 'hair' && state.color !== 'charcoal') {
        // Multiplying a neutral sculpt's luminance preserves its highlights.
        const brightness = (pixels[index] + pixels[index + 1] + pixels[index + 2]) / (3 * 62);
        const color = hairColors[state.color];
        for (let channel = 0; channel < 3; channel += 1) pixels[index + channel] = Math.min(255, color[channel] * brightness);
      }
      if (type === 'base' && state.skin !== 'original') {
        const isSkin = pixels[index] > pixels[index + 2] * 1.17 && pixels[index] > pixels[index + 1] * 1.07;
        if (isSkin) {
          const multipliers = skinTones[state.skin];
          for (let channel = 0; channel < 3; channel += 1) pixels[index + channel] *= multipliers[channel];
        }
      }
    }

    context.putImageData(imageData, 0, 0);
    toneCache.set(key, canvas);
    return canvas;
  }

  function selectedAsset(layer = state.editLayer) {
    if (layer === 'headgear') return state.headwear;
    if (layer === 'face') return state.face;
    return state.hair;
  }

  function adjustmentFor(asset) {
    return state.fits[asset] || { x: 0, y: 0, scale: 100 };
  }

  function fittedRectangle(asset) {
    const original = originalFits[asset];
    const adjustment = adjustmentFor(asset);
    const scale = adjustment.scale / 100;
    const width = original.width * scale;
    const height = original.height * scale;
    return {
      x: original.x + (original.width - width) / 2 + adjustment.x,
      y: original.y + (original.height - height) / 2 + adjustment.y,
      width, height
    };
  }

  function drawLayer(context, layer, applyFit = true) {
    const asset = layer === 'base' ? 'base' : selectedAsset(layer);
    if (asset === 'none') return;
    const rectangle = fittedRectangle(asset);
    const sprite = layer === 'hair' || layer === 'base' ? tintedSprite(layer) : sprites[asset];
    context.save();

    // A fitted hat uses only the exposed fringe. This deliberately simple mask
    // can be disabled to inspect the clipping that naive stacking produces.
    const hasHat = state.headwear === 'straw' || state.headwear === 'chopper';
    if (layer === 'hair' && hasHat && state.tuck && applyFit && state.order === 'over') {
      const hat = fittedRectangle(state.headwear);
      const brimHeight = state.headwear === 'straw' ? .78 : .79;
      const fringeTop = hat.y + hat.height * brimHeight;
      context.beginPath();
      context.rect(0, fringeTop, canvasSize, canvasSize - fringeTop);
      context.clip();
    }

    context.drawImage(sprite, rectangle.x, rectangle.y, rectangle.width, rectangle.height);
    context.restore();
  }

  function drawAvatar(canvas, onlyLayer) {
    const context = canvas.getContext('2d');
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.save();
    context.scale(canvas.width / canvasSize, canvas.height / canvasSize);
    const layers = state.order === 'over' ? ['base', 'hair', 'headgear', 'face'] : ['base', 'headgear', 'hair', 'face'];

    for (const layer of layers) {
      if (!onlyLayer || onlyLayer === layer) drawLayer(context, layer, !onlyLayer);
    }

    if (!onlyLayer && state.bounds && selectedAsset() !== 'none') {
      const rectangle = fittedRectangle(selectedAsset());
      context.strokeStyle = getComputedStyle(root).getPropertyValue('--foreground').trim() || getComputedStyle(root).color;
      context.lineWidth = 1.5;
      context.setLineDash([5, 5]);
      context.strokeRect(rectangle.x, rectangle.y, rectangle.width, rectangle.height);
    }
    context.restore();
  }

  function updateAdjustmentControls() {
    const asset = selectedAsset();
    const adjustment = adjustmentFor(asset);
    for (const field of ['x', 'y', 'scale']) {
      find('avatar-' + field).value = adjustment[field];
      find('avatar-' + field).disabled = asset === 'none';
      find('avatar-' + field + '-value').textContent = adjustment[field] + (field === 'scale' ? '%' : ' px');
    }
    find('avatar-restore').disabled = asset === 'none';
  }

  function render() {
    if (!ready) return;
    drawAvatar(find('avatar-main'));
    drawAvatar(find('avatar-small'));
    drawAvatar(find('avatar-medium'));
    for (const canvas of root.querySelectorAll('[data-layer-preview]')) drawAvatar(canvas, canvas.dataset.layerPreview);
    find('avatar-layers').hidden = !state.inspect;
    find('avatar-tuck').disabled = !['straw', 'chopper'].includes(state.headwear);
    updateAdjustmentControls();
    const faceLabel = state.face === 'blindfold' ? ' + Gojo’s blindfold' : '';
    find('avatar-status').textContent = itemLabels[state.headwear] + faceLabel;
    find('avatar-main').setAttribute('aria-label', 'Live layered avatar: ' + itemLabels[state.headwear] + faceLabel + ', ' + state.color + ' hair');
  }

  function saveState() {
    const host = window.openai;
    if (!host?.setWidgetState) return;
    Promise.resolve(host.setWidgetState({
      modelContent: { headwear: state.headwear, face: state.face, hair: state.hair, color: state.color, skin: state.skin, tuckHair: state.tuck, order: state.order, adjustments: state.fits },
      privateContent: state
    })).catch(() => {});
  }

  function restoreState(saved) {
    const candidate = saved?.privateContent;
    if (!candidate || typeof candidate !== 'object') return;
    state = structuredClone(initialState);
    const allowedValues = {
      headwear: ['straw', 'leaf', 'chopper', 'none'], face: ['none', 'blindfold'], hair: ['compact', 'tall', 'none'],
      color: Object.keys(hairColors), skin: Object.keys(skinTones), order: ['over', 'under'], editLayer: ['headgear', 'hair', 'face']
    };
    for (const [key, allowed] of Object.entries(allowedValues)) {
      if (allowed.includes(candidate[key])) state[key] = candidate[key];
    }
    for (const key of ['tuck', 'inspect', 'bounds']) {
      if (typeof candidate[key] === 'boolean') state[key] = candidate[key];
    }
    for (const asset of Object.keys(originalFits)) {
      if (asset === 'base') continue;
      const fit = candidate.fits?.[asset];
      if (!fit || !['x', 'y', 'scale'].every(key => Number.isFinite(fit[key]))) continue;
      state.fits[asset] = { x: Math.max(-80, Math.min(80, fit.x)), y: Math.max(-80, Math.min(80, fit.y)), scale: Math.max(65, Math.min(140, fit.scale)) };
    }
  }

  function syncInputs() {
    const values = { headwear: 'headwear', face: 'face', hair: 'hair', color: 'color', skin: 'skin', order: 'order', 'edit-layer': 'editLayer' };
    for (const [id, key] of Object.entries(values)) find('avatar-' + id).value = state[key];
    for (const key of ['tuck', 'inspect', 'bounds']) find('avatar-' + key).checked = state[key];
  }

  const inputBindings = { headwear: 'headwear', face: 'face', hair: 'hair', color: 'color', skin: 'skin', order: 'order', 'edit-layer': 'editLayer', tuck: 'tuck', inspect: 'inspect', bounds: 'bounds' };
  for (const [id, key] of Object.entries(inputBindings)) {
    const input = find('avatar-' + id);
    input.addEventListener('change', () => {
      state[key] = input.type === 'checkbox' ? input.checked : input.value;
      render();
      saveState();
    });
  }

  for (const field of ['x', 'y', 'scale']) {
    const input = find('avatar-' + field);
    input.addEventListener('input', () => {
      const asset = selectedAsset();
      if (asset === 'none') return;
      state.fits[asset] = { ...adjustmentFor(asset), [field]: Number(input.value) };
      render();
    });
    input.addEventListener('change', saveState);
  }

  find('avatar-restore').addEventListener('click', () => {
    delete state.fits[selectedAsset()];
    render();
    saveState();
  });
  find('avatar-shuffle').addEventListener('click', () => {
    const choose = options => options[Math.floor(Math.random() * options.length)];
    state.headwear = choose(['straw', 'leaf', 'chopper', 'none']);
    state.face = choose(['none', 'blindfold']);
    state.hair = choose(['compact', 'tall']);
    state.color = choose(Object.keys(hairColors));
    state.skin = choose(Object.keys(skinTones));
    syncInputs();
    render();
    saveState();
  });

  restoreState(window.openai?.widgetState);
  syncInputs();
  window.addEventListener('openai:set_globals', event => {
    const saved = event.detail?.globals?.widgetState;
    if (!saved) return;
    restoreState(saved);
    syncInputs();
    render();
  });

  async function initialize() {
    try {
      const [base, hair, props] = await Promise.all([loadImage(sourceUrls.base), loadImage(sourceUrls.hair), loadImage(sourceUrls.props)]);
      sprites.base = extractSprite(base, [0, 0, base.width, base.height]);
      sprites.hair = extractSprite(hair, [0, 0, hair.width, hair.height]);
      const propNames = ['straw', 'leaf', 'chopper', 'blindfold'];
      propNames.forEach((name, column) => {
        sprites[name] = extractSprite(props, [column * props.width / 4, 0, props.width / 4, props.height * .42]);
      });
      ready = true;
      root.dataset.ready = 'true';
      render();
    } catch (error) {
      find('avatar-status').setAttribute('role', 'alert');
      find('avatar-status').textContent = error.message;
    }
  }

  initialize();
})();
</script>
