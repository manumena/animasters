<div id="avatar-arrow-layouts" class="viz-carousel viz-dotted-background" aria-label="Arcade arrow layouts">
  <section data-variant="Side stacks" aria-label="Side stacks">
    <form class="entry" aria-label="Side stacks room entry">
      <header><span>Animasters</span><h2>Join a room</h2></header>
      <label class="nickname">Nickname<input name="nickname" placeholder="Your nickname" maxlength="24"></label>
      <div class="side-bank" data-controls>
        <div class="side-portrait portrait"><canvas data-avatar width="384" height="384" role="img" aria-label="Current avatar"></canvas></div>
      </div>
      <div class="current" data-current aria-live="polite"></div>
      <button class="join" type="button">Join room</button>
      <span data-result role="status"></span>
    </form>
  </section>

  <section data-variant="Rows below" aria-label="Rows below" hidden>
    <form class="entry" aria-label="Rows below room entry">
      <header><span>Animasters</span><h2>Join a room</h2></header>
      <label class="nickname">Nickname<input name="nickname" placeholder="Your nickname" maxlength="24"></label>
      <div class="top-portrait portrait"><canvas data-avatar width="384" height="384" role="img" aria-label="Current avatar"></canvas></div>
      <div class="rows" data-controls></div>
      <button class="join" type="button">Join room</button>
      <span data-result role="status"></span>
    </form>
  </section>

  <section data-variant="Grouped rows" aria-label="Grouped rows" hidden>
    <form class="entry" aria-label="Grouped rows room entry">
      <header><span>Animasters</span><h2>Join a room</h2></header>
      <label class="nickname">Nickname<input name="nickname" placeholder="Your nickname" maxlength="24"></label>
      <div class="group-portrait portrait"><canvas data-avatar width="384" height="384" role="img" aria-label="Current avatar"></canvas></div>
      <div class="groups" role="group" aria-label="Visible settings">
        <button type="button" data-group="appearance" aria-pressed="true">Hair &amp; skin</button>
        <button type="button" data-group="details" aria-pressed="false">Face &amp; prop</button>
      </div>
      <div class="rows" data-controls></div>
      <button class="join" type="button">Join room</button>
      <span data-result role="status"></span>
    </form>
  </section>
</div>

<style>
  #avatar-arrow-layouts > section {
    color-scheme: light dark;
    --paper: light-dark(#fff9ef, #27201d);
    --ink: light-dark(#39251d, #f8e8d9);
    --muted-ink: light-dark(#71584c, #ceb3a3);
    --line: light-dark(#dfc8b7, #59443b);
    --tray: light-dark(#f1e1d4, #382b25);
    --accent: light-dark(#a74732, #ffab8c);
    --on-accent: light-dark(#fff7ee, #3b211a);
    --selected: light-dark(#f8ded0, #563328);
    display: grid;
    place-items: start center;
    min-block-size: 694px;
    padding: 14px 10px 18px;
  }
  #avatar-arrow-layouts [hidden] { display: none !important; }
  #avatar-arrow-layouts .entry {
    box-sizing: border-box;
    width: min(100%, 440px);
    display: grid;
    gap: 10px;
    padding: 16px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    font: 14px/1.32 system-ui, sans-serif;
  }
  #avatar-arrow-layouts header { display: grid; gap: 2px; }
  #avatar-arrow-layouts header span { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-ink); }
  #avatar-arrow-layouts h2 { margin: 0; font-size: 23px; font-weight: 680; }
  #avatar-arrow-layouts .nickname { display: grid; gap: 4px; }
  #avatar-arrow-layouts :is(input, button) { box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: inherit; font: inherit; }
  #avatar-arrow-layouts input { width: 100%; min-height: 38px; padding: 6px 8px; }
  #avatar-arrow-layouts button { min-height: 42px; padding: 5px 8px; }
  #avatar-arrow-layouts :is(input, button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #avatar-arrow-layouts .portrait { display: grid; place-items: center; background: var(--tray); border-radius: 13px; min-width: 0; }
  #avatar-arrow-layouts canvas { width: min(100%, var(--portrait-size, 192px)); height: auto; display: block; }
  #avatar-arrow-layouts .top-portrait { --portrait-size: 126px; }
  #avatar-arrow-layouts .group-portrait { --portrait-size: 184px; }
  #avatar-arrow-layouts .side-bank { display: grid; grid-template-columns: 86px minmax(0, 1fr) 44px; grid-template-rows: repeat(6, 44px); gap: 4px 7px; }
  #avatar-arrow-layouts .side-portrait { grid-column: 2; grid-row: 1 / span 6; }
  #avatar-arrow-layouts .side-pair { display: contents; }
  #avatar-arrow-layouts .side-pair button:first-child { grid-column: 1; }
  #avatar-arrow-layouts .side-pair button:last-child { grid-column: 3; }
  #avatar-arrow-layouts .arrow { display: grid; place-items: center; padding: 0 3px; line-height: 1; }
  #avatar-arrow-layouts .chevron { font-size: 29px; }
  #avatar-arrow-layouts .labeled-arrow { display: flex; align-items: center; justify-content: center; gap: 5px; }
  #avatar-arrow-layouts .short-label { font-size: 11px; }
  #avatar-arrow-layouts .side-pair[data-active="true"] button, #avatar-arrow-layouts [data-group][aria-pressed="true"] { background: var(--selected); border-color: var(--accent); }
  #avatar-arrow-layouts .current { min-height: 20px; text-align: center; color: var(--muted-ink); }
  #avatar-arrow-layouts .rows { display: grid; gap: 4px; }
  #avatar-arrow-layouts .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 6px; align-items: stretch; }
  #avatar-arrow-layouts .row-copy { display: grid; align-content: center; gap: 1px; padding: 1px 4px; text-align: center; min-width: 0; }
  #avatar-arrow-layouts .row-copy > span:first-child { color: var(--muted-ink); font-size: 11px; }
  #avatar-arrow-layouts .row-value { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; font-weight: 600; }
  #avatar-arrow-layouts .swatch { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); }
  #avatar-arrow-layouts .groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  #avatar-arrow-layouts .join { color: var(--on-accent); background: var(--accent); border-color: var(--accent); font-weight: 650; }
  #avatar-arrow-layouts [data-result] { min-height: 16px; font-size: 12px; color: var(--muted-ink); margin-top: -6px; }
  @media (max-width: 420px) {
    #avatar-arrow-layouts > section { padding-inline: 5px; min-block-size: 706px; }
    #avatar-arrow-layouts .entry { padding: 12px; }
    #avatar-arrow-layouts input { font-size: 16px; }
    #avatar-arrow-layouts .side-bank { grid-template-columns: 60px minmax(0, 1fr) 44px; gap: 4px; }
    #avatar-arrow-layouts .labeled-arrow { flex-direction: column; gap: 0; }
    #avatar-arrow-layouts .labeled-arrow .chevron { font-size: 22px; }
  }
  @media (pointer: coarse) {
    #avatar-arrow-layouts :is(button, input) { min-height: 44px; }
  }
</style>

})();
</script>
