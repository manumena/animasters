<style>
  #podium-avatar-sizes > [data-variant] {
    box-sizing: border-box;
    min-height: 490px;
    padding: 16px;
  }

  #podium-avatar-sizes .size-comparison {
    width: min(704px, 100%);
    margin-inline: auto;
    font: 400 14px/1.4 system-ui, sans-serif;
  }

  #podium-avatar-sizes .size-caption {
    margin: 0 0 8px;
    color: light-dark(#39464c, #c5d2d6);
    font-size: 12px;
  }

  #podium-avatar-sizes .size-results {
    --room-panel: #1b2b32;
    --room-text: #f2f7f4;
    --room-muted: #b0c1c5;
    --room-line: #354950;
    --room-accent: #9ae1d0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 226px;
    align-items: start;
    gap: 12px;
    color: var(--room-text);
  }

  #podium-avatar-sizes .size-results section {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--room-line);
    border-radius: 16px;
    background: var(--room-panel);
  }

  #podium-avatar-sizes .size-results :is(h2, p) {
    margin: 0;
  }

  #podium-avatar-sizes .size-finale {
    text-align: center;
  }

  #podium-avatar-sizes .size-kicker {
    color: var(--room-accent);
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.12em;
    text-align: left;
    text-transform: uppercase;
  }

  #podium-avatar-sizes .size-finale h2 {
    margin-top: 14px;
    color: var(--room-text);
    font-size: clamp(20px, 4vw, 25px);
    line-height: 1.2;
  }

  #podium-avatar-sizes .size-podium {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: end;
    gap: 8px;
    max-width: 420px;
    margin: 16px auto 0;
    padding: 0;
    list-style: none;
  }

  #podium-avatar-sizes .size-podium li {
    display: grid;
    justify-items: center;
    gap: 6px;
    min-width: 0;
  }

  #podium-avatar-sizes .size-podium li[data-rank='1'] {
    --portrait-size: var(--winner-size);
    grid-column: 2;
    grid-row: 1;
  }

  #podium-avatar-sizes .size-podium li[data-rank='2'] {
    grid-column: 1;
    grid-row: 1;
  }

  #podium-avatar-sizes .size-avatar {
    display: inline-grid;
    place-items: center;
    width: min(var(--portrait-size), 100%);
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 50%;
    background: #30474c;
    color: var(--room-accent);
    font-weight: 700;
  }

  #podium-avatar-sizes .size-podium {
    --portrait-size: var(--runner-size);
  }

  #podium-avatar-sizes .size-avatar img {
    display: block;
    width: 100%;
    height: 100%;
    transform: scale(1.18);
  }

  #podium-avatar-sizes .size-name {
    color: var(--room-text);
    font-size: 13px;
    font-weight: 650;
    overflow-wrap: anywhere;
  }

  #podium-avatar-sizes .size-name[data-me] {
    color: var(--room-accent);
  }

  #podium-avatar-sizes :is(.size-meta, small) {
    color: var(--room-muted);
    font-size: 12px;
  }

  #podium-avatar-sizes .size-step {
    display: grid;
    place-items: center;
    width: 100%;
    min-height: 28px;
    border-radius: 7px 7px 2px 2px;
    background: #293f49;
    font-weight: 700;
  }

  #podium-avatar-sizes li[data-rank='2'] .size-step {
    min-height: 38px;
  }

  #podium-avatar-sizes li[data-rank='1'] .size-step {
    min-height: 52px;
    background: #534938;
  }

  #podium-avatar-sizes .size-finale .size-personal {
    display: grid;
    gap: 4px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--room-line);
    color: var(--room-muted);
    font-size: 12px;
  }

  #podium-avatar-sizes .size-personal strong {
    color: var(--room-accent);
    font-size: 18px;
  }

  #podium-avatar-sizes .size-scoreboard {
    --portrait-size: 34px;
  }

  #podium-avatar-sizes .size-scoreboard header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  #podium-avatar-sizes .size-scoreboard h2 {
    color: var(--room-text);
    font-size: 17px;
  }

  #podium-avatar-sizes .size-scoreboard ol {
    margin: 8px 0 12px;
    padding: 0;
    list-style: none;
  }

  #podium-avatar-sizes .size-scoreboard li {
    display: grid;
    grid-template-columns: 12px 34px minmax(0, 1fr) auto;
    align-items: center;
    gap: 7px;
    padding-block: 9px;
    border-bottom: 1px solid var(--room-line);
  }

  #podium-avatar-sizes .size-scoreboard li div small {
    display: block;
    font-size: 11px;
    overflow-wrap: anywhere;
  }

  #podium-avatar-sizes .size-points {
    white-space: nowrap;
  }

  @media (max-width: 620px) {
    #podium-avatar-sizes > [data-variant] {
      min-height: 775px;
      padding: 10px;
    }

    #podium-avatar-sizes .size-results {
      grid-template-columns: minmax(0, 1fr);
    }
  }
</style>

  for (const variant of root.querySelectorAll(':scope > [data-variant]')) {
    variant.append(template.content.cloneNode(true));

    for (const image of variant.querySelectorAll('[data-portrait]')) {
      image.src = portraits[image.dataset.portrait];
    }

    const settings = {
      winner: Number(variant.dataset.winnerSize),
      runners: Number(variant.dataset.runnerSize),
    };
    const caption = variant.querySelector('[data-size-caption]');

    function renderSizes() {
      variant.style.setProperty('--winner-size', settings.winner + 'px');
      variant.style.setProperty('--runner-size', settings.runners + 'px');
      caption.textContent = 'Winner up to ' + settings.winner + ' px · Second and third up to ' + settings.runners + ' px';
    }

    renderSizes();

    if (globalThis.Tweak) {
      const panel = variant.querySelector('.size-finale');
      const tweak = new globalThis.Tweak({ container: panel, onChange: renderSizes });
      tweak.addSlider(settings, 'winner', { label: 'Winner diameter', min: 56, max: 132, unit: 'px' });
      tweak.addSlider(settings, 'runners', { label: 'Second and third diameter', min: 48, max: 120, unit: 'px' });
    }
  }
